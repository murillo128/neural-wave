site_name: Neural Wave
site_description: A structured conceptual reference for understanding LLMs
site_url: https://murillo128.github.io/neural-wave/

repo_name: murillo128/neural-wave
repo_url: https://github.com/murillo128/neural-wave

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Learning Map: learning-map.md
  - Foundations:
      - Tokenization: foundations/tokenization.md
      - Embeddings & Representation Geometry: foundations/embeddings-and-representation-geometry.md
  - Transformer Core:
      - Positional Information: transformers/positional-information.md
      - Transformer Block & Residual Stream: transformers/transformer-block.md
  - Glossary: glossary.md
